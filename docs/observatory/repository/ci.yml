name: OSG integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OSG and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/observatory tests/test_observatory_core.py tests/test_observatory_hardening.py tests/test_observatory_limitations.py
      - name: Unit and integrity tests
        run: PYTHONPATH=src pytest tests/test_observatory_core.py tests/test_observatory_hardening.py tests/test_observatory_limitations.py -m "not release_assets" -q
      - name: No-paid-API and outbound policy gate
        run: PYTHONPATH=src python -m observatory.cli policy
